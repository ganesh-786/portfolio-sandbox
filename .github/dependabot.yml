# Weekly dependency updates.
#
# Security updates are separate. They are switched on in the repository settings and open their own
# pull requests as soon as an advisory is published, without waiting for the weekly run or the
# cooldown below.
#
# Every pull request opened here has to pass the same checks as any other change, and nothing is
# merged automatically. Routine updates are grouped, so a normal week is one pull request per
# ecosystem. A new major version of the framework or its toolchain is a project of its own, not a
# routine bump, so those are ignored on purpose. Remove an entry when that project is picked up.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 3
    # Wait a week after a release before proposing it, so a bad release has time to be pulled.
    cooldown:
      default-days: 7
    assignees:
      - ganesh-786
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss/postcss'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # These follow the React and Node versions above, they do not move on their own.
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - ganesh-786
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
    # The deploy workflow's actions have to move together, and are upgraded by hand and tested first.
    # Once that is done this entry can be removed so major versions are proposed too.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
